<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PollyGlot</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="images/parrot.png" alt="A smiling parrot">
            <div class="header-text">
                <h1>PollyGlot</h1>
                <p>Perfect Translation Every Time</p>
            </div>
        </div>
    </header>
    <main>
        <form id="main-form">
            <p id="text-one" class="main-paragraph">Text to Translate 👇</p>
            <textarea name="english-text" id="english-text" required></textarea>
            
            <div id="lanuguage-selection">
                <fieldset>
                <legend id="text-two" class="main-paragraph">Select Language 👇</legend>
                <div class="radio-group">
                    <input type="radio" value="French" id="frenchBtn" name="languageBtn">
                    <label for="frenchBtn">French <img src="images/fr-flag.png" alt="Flag of France" class="flag"></label><br>

                    <input type="radio" value="Spanish" id="spanishBtn" name="languageBtn">
                    <label for="spanishBtn">Spanish <img src="images/sp-flag.png" alt="Flag of Spain" class="flag"></label><br>

                    <input type="radio" value="Japanese" id="japaneseBtn" name="languageBtn">
                    <label for="japaneseBtn">Japanese <img src="images/jpn-flag.png" alt="Flag of Japan" class="flag"></label><br>

                </div>
            </fieldset>

            <button type="submit">Translate</button>
            </div>
        </form>
    </main>
    <script src="index.js" type="module"></script>
</body>
</html>
